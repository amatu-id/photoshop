<!doctype html>
<html lang="id" data-theme="glass-dark">
<head>
<meta charset="utf-8">
<script src="/amatu.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amatu Photo</title>
<meta name="description" content="Amatu Photo — editor foto berbasis layer di browser: layer, mask, blend mode, adjustment layer, filter, brush, seleksi, pen tool, teks, free transform, Camera Raw, Liquify, impor/ekspor PSD.">
<meta name="theme-color" content="#14161c">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,300..500,0..1,0&display=block">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="booting">
<svg class="defs" width="0" height="0" aria-hidden="true">
  <filter id="liquid" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.007 0.011" numOctaves="2" seed="11" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2.4" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="38" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="wallpaper" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>

<div id="app">
  <header id="menubar" class="menubar glass" role="menubar"></header>
  <div id="optionsbar" class="optionsbar glass" role="toolbar" aria-label="Opsi tool"></div>
  <main class="workarea">
    <aside id="toolbar" class="toolbar glass" aria-label="Tools"></aside>
    <section class="docarea">
      <div id="doctabs" class="doctabs" role="tablist"></div>
      <div id="canvashost" class="canvashost"></div>
      <footer id="statusbar" class="statusbar"></footer>
      <div id="home" class="home"></div>
    </section>
    <div id="dockicons" class="dockicons glass"></div>
    <aside id="dock" class="dock" aria-label="Panel"></aside>
  </main>
</div>

<div id="popups"></div>
<div id="dialogs"></div>
<div id="toasts" class="toasts"></div>
<div id="tooltip" class="tooltip glass" role="tooltip"></div>
<div id="dropzone" class="dropzone"><div class="dz-inner glass"><span class="ms">upload_file</span><b>Lepaskan untuk membuka</b><small>Gambar dibuka sebagai dokumen baru · tahan Shift untuk menempatkan sebagai layer</small></div></div>
<div class="splash" aria-hidden="true"><img src="icon.svg" alt="" width="64" height="64"><b>Amatu Photo</b><div class="bar"><i></i></div></div>
<noscript><p style="padding:24px;font-family:sans-serif;color:#fff">Amatu Photo memerlukan JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
